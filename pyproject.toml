[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highpitchct"
version = "0.3.1"
description = "Stage-gated research pipeline for TCIA CT projection data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Brahim Soufghalem"}]
dependencies = [
  "pydicom>=2.4,<4",
  "requests>=2.28",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hpct = "highpitchct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
